name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - name: System deps for AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 rpm fakeroot dpkg
      - run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package (never publish — softprops job is the sole publisher)
        run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: cogitator-linux
          path: |
            release/*.AppImage
            release/*.tar.gz
            release/latest-linux.yml
          if-no-files-found: error

  publish:
    needs: [build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: List artifacts
        run: find dist -type f -ls
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cogitator-linux/*
          generate_release_notes: true
          prerelease: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
